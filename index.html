<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
       <img src="images/arrow.png" class="arrow left">
       <div class="frame">
        <div class="slider">
            <img src="images/image-1.jpg" class="image">
            <img src="images/image-2.jpg" class="image">
            <img src="images/image-3.jpg" class="image">
            <img src="images/image-4.jpg" class="image">
        </div>
       </div>
       <img src="images/arrow.png" class="arrow right">
    </div>
</body>
</html>
