    <link rel="stylesheet" href="style.css">

<body>

        <div class="top">
            <img src="images/arrow.png" class="arrow left">

                <div class="slider">

            </div><!--end frame-->
            <img src="images/arrow.png" class="arrow right">
        </div><!--end top-->
